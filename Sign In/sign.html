<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HirePath - Sign In</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="header">

            <div class="brand">
               
                <div class="logo-placeholder">
                    <img src="../logo.jpg" alt="logo">
                </div>

                <span>HirePath</span>
            </div>

            <div class="header-right">
                <p>Your next chapter starts here.</p>

                <div class="header-links">
                    <a href="#" class="Need">Need help?</a>
                    
                </div>
            </div>

        </header>


    <!-- Main -->
    <main class="main-container">

        <div class="login-card">

            <!-- Logo -->
            <div class="logo">
                <img src="../logo.jpg" alt="logo" width="90px" height="70px">
            </div>

            <h1>Sign In</h1>

            <p class="subtitle">
                Welcome back. Your next chapter awaits.
            </p>


            <!-- Login Form -->
            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">

                    <label for="email">Email</label>

                    <div class="input-box">

                        <span class="input-icon">✉</span>

                        <input type="email" id="email" placeholder="you@example.com" required>

                    </div>

                </div>


                <!-- Password -->
                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-box">

                        <span class="input-icon">🔒</span>

                        <input type="password" id="password" placeholder="Enter your password" required>

                        <button type="button" class="eye-btn" id="togglePassword">
                            
                        </button>

                    </div>

                </div>


                <!-- Remember & Forgot -->
                <div class="form-options">

                    <label class="remember">

                        <input type="checkbox" id="remember" checked>

                        <span>Remember me</span>

                    </label>

                    <a href="../Reset Password/index.html">
                        Forgot Password?
                    </a>

                </div>


                <!-- Error -->
                <p id="errorMessage"></p>


                <!-- Sign In Button -->
                <button type="submit" class="signin-btn">
                    Sign In ←
                </button>

            </form>


            <!-- Divider -->
            <div class="divider">
                <span></span>
                <p>OR</p>
                <span></span>
            </div>


            <!-- Social Login -->
            <div class="social-buttons">

                <button type="button" class="social-btn" id="googleBtn">
                    <span class="google-icon">G</span>
                    Google
                </button>

                <button type="button" class="social-btn" id="linkedinBtn">
                    <span class="linkedin-icon">in</span>
                    LinkedIn
                </button>

            </div>


            <!-- Create Account -->
            <p class="signup-text">
                New to HirePath?

                <a href="../createAccount/sigup.html">
                    Create Account
                </a>
            </p>

        </div>

    </main>


    <!-- Footer -->
    <footer>

        <span>©️ 2026 HirePath. All rights reserved.</span>

        <a href="#">Privacy Policy</a>

    </footer>


    <script src="script.js"></script>

</body>

</html>
