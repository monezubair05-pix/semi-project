<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HirePath - Set New Password</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Logo -->
        <header class="header">

         <div class="brand">

            <div class="logo-placeholder">
                <img src="../logo.jpg" alt="logo">
            </div>

            <span>HirePath</span>
        </div>
        <div class="header-right">

            <span>Your next chapter starts here.</span>

            <a href="#" class="help-link">
                ⓘ Need help?
            </a>

        </div>

        </header>

    <div class="page">

        

        <!-- Password Card -->
        <main class="password-container">

            <div class="password-card">

                <div class="lock-icon">🔐</div>

                <h1>Set New Password</h1>

                <p class="subtitle">
                    A fresh start with a stronger password.
                </p>

                <form id="passwordForm">

                    <!-- New Password -->
                    <div class="form-group">

                        <label for="password">
                            New Password
                        </label>

                        <div class="input-box">

                            <span class="input-icon">🔒</span>

                            <input
                                type="password"
                                id="password"
                                placeholder="Enter new password"
                                required
                            >

                            <button
                                type="button"
                                class="eye-btn"
                                data-target="password"
                            >
                                 👁
                            </button>

                        </div>

                    </div>

                    <!-- Password Strength -->
                    <div class="strength-section">

                        <div class="strength-bars">
                            <span></span>
                            <span></span>
                            <span></span>
                            <span></span>
                        </div>

                        <small id="strengthText">
                            Enter a password
                        </small>

                    </div>

                    <!-- Password Requirements -->
                    <div class="requirements">

                        <p id="length">
                            <span>○</span>
                            At least 8 characters
                        </p>

                        <p id="special">
                            <span>○</span>
                            At least one special character
                        </p>

                        <p id="letters">
                            <span>○</span>
                            Uppercase and lowercase letters
                        </p>

                    </div>

                    <!-- Confirm Password -->
                    <div class="form-group confirm-group">

                        <label for="confirmPassword">
                            Confirm Password
                        </label>

                        <div class="input-box">

                            <span class="input-icon">🔒</span>

                            <input
                                type="password"
                                id="confirmPassword"
                                placeholder="Confirm your password"
                                required
                            >

                            <button
                                type="button"
                                class="eye-btn"
                                data-target="confirmPassword"
                            >
                             👁
                                
                            </button>

                        </div>

                    </div>

                    <p id="errorMessage"></p>

                    <!-- Submit -->
                    <button type="submit" class="save-btn" >
                        Save Password & Sign In →
                    </button>

                </form>

                <!-- Back To Login -->
                <a href="../Enter Verification Code/index.html" class="back-link">
                    ← Back to Sign In
                </a>

            </div>

        </main>

        <!-- Footer -->
        <footer>
            ©️ 2026 HirePath. All rights reserved.
        </footer>

    </div>

    <script src="script.js"></script>

</body>
</html>
